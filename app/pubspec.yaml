name: psychosims
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'
  flutter: '>=3.38.5'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  cupertino_icons: 1.0.9
  http: 1.6.0
  web: 1.1.1
  psyconfig:
    path: ../config
  psychemas:
    path: ../packages/psychemas
  psycore:
    path: ../packages/psycore

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - ../content/manifests/poc_sample.json
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSerif_LICENSE.txt
    - assets/art/clinic-noir.png
    - assets/art/restless-hour-portrait.png
  fonts:
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
