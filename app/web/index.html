<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Psychosims: fictional psychology practice, with saved games available offline.">
  <meta name="theme-color" content="#10191a">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://openrouter.ai; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Psychosims</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="stylesheet" href="shell.css">
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</head>
<body>
  <main id="flutter-host" aria-label="Psychosims game"></main>
  <aside id="pwa-bar" aria-label="App availability">
    <span id="pwa-status" role="status" aria-live="polite">Preparing offline resources…</span>
    <button id="pwa-retry" type="button" hidden>Retry download</button>
    <button id="pwa-install" type="button" hidden>Install app</button>
  </aside>
  <noscript>Psychosims needs JavaScript enabled. Saved games stay in this browser.</noscript>
</body>
</html>
