name: Static PWA verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static application and build production artifact
        run: make verify
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify production PWA in Chromium
        run: npm run test:browser
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychosims-browser-evidence
          path: test-results
          if-no-files-found: ignore
      - name: Upload reviewed build (does not publish)
        uses: actions/upload-artifact@v4
        with:
          name: psychosims-static-pwa
          path: app/build/web
          include-hidden-files: true
          if-no-files-found: error
